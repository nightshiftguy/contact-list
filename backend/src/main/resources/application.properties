spring.sql.init.mode=always
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.web.locale=en_EN
spring.web.locale-resolver=fixed

spring.jpa.hibernate.ddl-auto = create
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.api_key=${SPRING_MAIL_API_KEY}

spring.jwt.secret_key=${SPRING_JWT_SECRET_KEY}
spring.encryption.sensitive-field.key=${SPRING_ENCRYPTION_SENSITIVE_FIELD_KEY}
spring.encryption.sensitive-field.algorithm=${SPRING_ENCRYPTION_SENSITIVE_FIELD_ALGORITHM}

spring.cors.allowed-origins=${SPRING_CORS_ALLOWED_ORIGINS}